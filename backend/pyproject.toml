[project]
name = "charissa"
version = "0.1.0"
description = "Conversational data engineering assistant"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pandas>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["charissa*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
